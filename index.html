<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#000935"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Onus WMS · Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=REM:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Raleway:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#030712;--bg1:#050d1a;--bg2:#0d1625;--bg3:#111e30;--bg4:#162030;
  --border:#1d2638;--border2:#253045;
  --accent:#00C9CE;--accent-dim:rgba(0,201,206,.12);--accent-glow:rgba(0,201,206,.25);
  --blue:#5b8def;--amber:#f59e0b;--purple:#a78bfa;--pink:#ec4899;--green:#10b981;
  --red:#ef4444;--orange:#f97316;--cyan:#06b6d4;
  --fg0:#ffffff;--fg1:#e5e7eb;--fg2:#9ca3af;--fg3:#6b7280;--fg4:#374151;
  --r-xs:4px;--r-sm:7px;--r-md:10px;--r-lg:14px;--r-xl:18px;
  --font:'REM',sans-serif;--font-h:'Raleway',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --sb-w:220px;
  --transition:120ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;background:var(--bg0);color:var(--fg1);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden}
#root{height:100%}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font)}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent-dim);color:var(--accent)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px}

/* ── Responsive breakpoints ── */
@media(max-width:768px){
  :root{--sb-w:0px}
  .sb-desktop{display:none!important}
  .mobile-nav{display:flex!important}
  .page{padding:12px 14px 80px!important}
  .kpi-grid-4{grid-template-columns:1fr 1fr!important}
  .grid-2,.grid-3{grid-template-columns:1fr!important}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr!important}
  .page-head{flex-direction:column;gap:10px}
  .page-actions{width:100%;justify-content:flex-end}
  .tbl-toolbar{flex-wrap:wrap}
  .tbl-wrap{overflow-x:auto}
  .topbar{padding:0 14px}
  .hide-mobile{display:none!important}
}
@media(min-width:769px){
  .mobile-nav{display:none!important}
  .sb-desktop{display:flex!important}
}

/* ── Layout ── */
.layout{display:flex;width:100%;height:100vh;overflow:hidden}
.sidebar{width:var(--sb-w);flex-shrink:0;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;position:relative;z-index:10}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg0)}
.topbar{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;background:var(--bg1)}
.page{flex:1;overflow-y:auto;padding:20px 24px 48px;scroll-behavior:smooth}

/* ── Sidebar ── */
.sb-brand{padding:14px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#000935 0%,#001a6e 100%);border:1px solid rgba(0,201,206,.2);display:grid;place-items:center;flex-shrink:0;font-family:var(--font-h);font-weight:900;font-size:15px;color:var(--accent);letter-spacing:-.01em}
.sb-name{font-family:var(--font-h);font-weight:800;font-size:13.5px;color:var(--fg0);line-height:1.1}
.sb-ver{font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.sb-nav{flex:1;padding:6px 8px;overflow-y:auto}
.sb-section{font-size:9px;font-weight:700;color:var(--fg4);text-transform:uppercase;letter-spacing:.12em;padding:12px 8px 4px;display:flex;align-items:center;gap:6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);color:var(--fg2);font-size:12.5px;font-weight:500;cursor:pointer;margin-bottom:1px;transition:all var(--transition);border:none;background:none;width:100%;text-align:left;position:relative}
.sb-item:hover{background:var(--bg3);color:var(--fg1)}
.sb-item.active{background:rgba(0,201,206,.1);color:var(--accent);font-weight:600}
.sb-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--accent);border-radius:999px}
.sb-badge{margin-left:auto;background:var(--bg3);color:var(--fg3);font-size:10px;padding:1px 6px;border-radius:999px;font-family:var(--font-mono);min-width:20px;text-align:center}
.sb-item.active .sb-badge{background:var(--accent-dim);color:var(--accent)}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;font-weight:700;font-size:12px;color:#000935;flex-shrink:0;font-family:var(--font-h)}
.sb-foot-name{font-size:12px;font-weight:600;color:var(--fg1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.sb-foot-role{font-size:10px;color:var(--fg3)}

/* ── Mobile bottom nav ── */
.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100}
.mob-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:10px;color:var(--fg3);background:none;border:none;font-family:var(--font);min-width:52px;transition:color var(--transition)}
.mob-item.active{color:var(--accent)}
.mob-icon{font-size:18px;line-height:1}

/* ── Topbar ── */
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg3)}
.crumb-sep{color:var(--fg4)}
.crumb-now{color:var(--fg1);font-weight:600}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-btn{width:32px;height:32px;border-radius:var(--r-sm);background:none;border:1px solid var(--border);color:var(--fg2);display:grid;place-items:center;cursor:pointer;font-size:15px;transition:all var(--transition)}
.topbar-btn:hover{background:var(--bg3);color:var(--fg1)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap;line-height:1}
.btn-primary{background:var(--accent);color:#000935}
.btn-primary:hover{background:#00b8bd;box-shadow:0 0 0 3px var(--accent-glow)}
.btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--fg1);border-color:var(--border2)}
.btn-danger{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-success{background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-icon{width:30px;height:30px;padding:0;border-radius:var(--r-sm);display:grid;place-items:center}

/* ── Page header ── */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
.page-title{font-family:var(--font-h);font-weight:800;font-size:24px;color:var(--fg0);letter-spacing:-.02em;line-height:1}
.page-lead{font-size:11.5px;color:var(--fg3);margin-top:4px}
.page-actions{display:flex;gap:8px;flex-shrink:0;align-items:flex-start}

/* ── KPI cards ── */
.kpi-grid{display:grid;gap:10px;margin-bottom:16px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-3{grid-template-columns:repeat(3,1fr)}
.kpi-grid-2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent))}
.kpi-label{font-size:9.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi-dot{width:5px;height:5px;border-radius:50%;background:var(--kc,var(--accent));flex-shrink:0}
.kpi-val{font-family:var(--font-h);font-weight:800;font-size:24px;color:var(--fg0);letter-spacing:-.02em;line-height:1}
.kpi-delta{font-size:11px;color:var(--fg3);margin-top:5px;display:flex;align-items:center;gap:4px}
.kpi-delta.up{color:var(--green)}
.kpi-delta.down{color:var(--red)}
.kpi-sparkline{position:absolute;bottom:0;right:0;opacity:.3}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;transition:border-color var(--transition)}
.card:hover{border-color:var(--border2)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--fg1)}
.card-sub{font-size:11px;color:var(--fg3);margin-top:2px;line-height:1.4}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ── Tables ── */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.tbl-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg2)}
.tbl-toolbar input,.tbl-toolbar select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;color:var(--fg1);font-family:var(--font);font-size:12px;outline:none;transition:border-color var(--transition)}
.tbl-toolbar input:focus,.tbl-toolbar select:focus{border-color:var(--accent)}
.tbl-toolbar input.grow{flex:1;min-width:140px}
.count{font-size:11px;color:var(--fg3);white-space:nowrap;font-family:var(--font-mono)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--bg1);color:var(--fg3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid rgba(29,38,56,.6);color:var(--fg1);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.tbl tr.selected td{background:var(--accent-dim)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg3)}
.num{text-align:right;font-family:var(--font-mono)}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid;white-space:nowrap;line-height:1.4}
.chip-accent{background:rgba(0,201,206,.1);color:var(--accent);border-color:rgba(0,201,206,.28)}
.chip-blue{background:rgba(91,141,239,.1);color:var(--blue);border-color:rgba(91,141,239,.28)}
.chip-amber{background:rgba(245,158,11,.1);color:var(--amber);border-color:rgba(245,158,11,.28)}
.chip-purple{background:rgba(167,139,250,.1);color:var(--purple);border-color:rgba(167,139,250,.28)}
.chip-pink{background:rgba(236,72,153,.1);color:var(--pink);border-color:rgba(236,72,153,.28)}
.chip-green{background:rgba(16,185,129,.08);color:var(--green);border-color:rgba(16,185,129,.28)}
.chip-gray{background:var(--bg3);color:var(--fg3);border-color:var(--border)}
.chip-orange{background:rgba(249,115,22,.1);color:var(--orange);border-color:rgba(249,115,22,.28)}
.chip-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--fg2)}
.chip-status .sd{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--fg3)}
.chip-status.activo{color:var(--green)}.chip-status.activo .sd{background:var(--green)}
.chip-status.salido{color:var(--fg3)}.chip-status.salido .sd{background:var(--fg4)}

/* ── Forms ── */
.form-card{background:var(--bg2);border:1px solid var(--accent-glow);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.form-grid{display:grid;gap:10px}
.form-grid-2{grid-template-columns:1fr 1fr}
.form-grid-3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.07em}
.field input,.field select,.field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 11px;color:var(--fg1);font-family:var(--font);font-size:13px;outline:none;width:100%;transition:border-color var(--transition)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,201,206,.08)}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.field select option{background:var(--bg2)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.form-title{font-size:14px;font-weight:700;color:var(--fg0)}
.coste-preview{background:var(--accent-dim);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:8px 12px;font-size:12px;color:var(--accent);margin-top:4px;display:flex;justify-content:space-between}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0;overflow-x:auto}
.tab{padding:8px 16px;font-size:12.5px;font-weight:500;color:var(--fg3);border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);transition:all var(--transition);white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--fg1)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ── Toast ── */
.toast-wrap{position:fixed;bottom:24px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:320px}
@media(max-width:768px){.toast-wrap{bottom:76px;right:12px;left:12px;max-width:none}}
.toast{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:10px 16px;font-size:12.5px;color:var(--fg1);box-shadow:0 8px 32px rgba(0,0,0,.6);animation:toastIn .2s ease;pointer-events:all}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
@keyframes toastIn{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* ── Scanner overlay ── */
.scanner-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.scanner-frame{width:260px;height:260px;border:3px solid var(--accent);border-radius:16px;position:relative;overflow:hidden;background:#000}
.scanner-frame video{width:100%;height:100%;object-fit:cover}
.scanner-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:.7;animation:scan 2s ease-in-out infinite}
@keyframes scan{0%{top:10%}50%{top:90%}100%{top:10%}}

/* ── Chart ── */
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:100px}
.col-day{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;min-width:0}
.col-stacks{display:flex;flex-direction:column;justify-content:flex-end;width:100%;flex:1;gap:1px}
.bar-seg{width:100%;border-radius:0;transition:opacity var(--transition);min-height:1px}
.bar-seg:first-child{border-radius:3px 3px 0 0}
.axis-label{font-size:8px;color:var(--fg4);text-align:center;margin-top:4px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;width:100%}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.leg-row{display:flex;align-items:center;gap:8px;font-size:11px}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.leg-lbl{color:var(--fg2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-cnt{color:var(--fg3);font-family:var(--font-mono);font-size:10px}
.leg-pct{color:var(--fg1);font-weight:600;font-family:var(--font-mono);font-size:10px;min-width:28px;text-align:right}

/* ── Client card ── */
.cc-avatar{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#000935;flex-shrink:0;font-family:var(--font-h)}
.progress-bar{height:3px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}

/* ── Total box ── */
.total-box{background:linear-gradient(135deg,#000935,#001560);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.total-label{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.total-amount{font-family:var(--font-h);font-size:28px;font-weight:800;color:var(--fg0);letter-spacing:-.02em}

/* ── Login ── */
.login-screen{min-height:100vh;background:var(--bg0);display:flex;align-items:center;justify-content:center;font-family:var(--font);padding:20px}
.login-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-xl);padding:36px 32px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.login-logo-wrap{text-align:center;margin-bottom:28px}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#000935,#001a6e);border:1px solid rgba(0,201,206,.25);display:grid;place-items:center;margin:0 auto 12px;font-family:var(--font-h);font-weight:900;font-size:24px;color:var(--accent)}
.login-title{font-family:var(--font-h);font-weight:800;font-size:22px;color:var(--fg0)}
.login-sub{font-size:12px;color:var(--fg3);margin-top:4px}

/* ── Spinner ── */
.spinner-wrap{min-height:100vh;background:var(--bg0);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Misc ── */
.sep{height:1px;background:var(--border);margin:14px 0}
.badge-num{background:var(--red);color:#fff;font-size:9px;font-weight:700;font-family:var(--font-mono);padding:1px 5px;border-radius:999px;min-width:16px;text-align:center;line-height:1.4}
.empty-state{text-align:center;padding:48px 20px;color:var(--fg3)}
.empty-state .ico{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}
.highlight{background:var(--accent-dim);color:var(--accent);padding:0 2px;border-radius:2px}
.tag{display:inline-block;background:var(--bg3);color:var(--fg2);font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--border)}

/* ── Print (PDFs) ── */
@media print{
  body{background:#fff;color:#000}
  .no-print{display:none!important}

  const d = m && y ? new Date(y,m-1,1) : new Date();

const csvDownload = (rows, cols, name) => {
  const bom = "\ufeff";
  const data = bom + [cols.join(";"), ...rows.map(r=>cols.map(c=>`"${String(r[c]||"").replace(/"/g,'""')}"`).join(";"))].join("\n");
  const a = Object.assign(document.createElement("a"),{href:URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8;"})),download:name});
  a.click(); URL.revokeObjectURL(a.href);
};

let KPI = {ops_hoy:0,pallets_activos:0,ingresos_hoy:0,ocupacion:0,ops_mes:0,ingresos_mes:0};
let SERIE_14D = Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));return{d:String(d.getDate()),alm:0,pic:0,car:0};});
let DIST_TIPOS = [];
let FACT_6M = [];
let _rerender = null;

const calcCoste = (tarifa_id, tipo, cantidad) => {
  const t = TARIFAS.find(t=>t.id===tarifa_id);
  if(!t) return 0;
  const qty = parseFloat(cantidad)||1;
  const map = {
    almacenaje: t.precio_pallet_dia||0,
    picking: t.precio_picking||0,
    empaquetado: t.precio_picking||0,
    carga: t.precio_carga||0,
    descarga: t.precio_descarga||0,
    "distribucion-interna": t.precio_distribucion||t.precio_picking||0,
    "distribucion-externa": t.precio_viaje||t.precio_distribucion||0,
    paletizacion: 15,
    inventario: 20,
    devolucion: 2.5,
  };
  return Math.round((parseFloat(map[tipo]||0)*qty)*100)/100;
};

const getClienteTarifa = (cliente_id) => {

// ── Cargar datos desde Supabase ──────────────────────────────────
const cargarDatos = async () => {
  try {
    const [cls, trs, movs, stk] = await Promise.all([
      api.get("clientes","?select=*,tarifas(nombre)&order=empresa"),
      api.get("tarifas","?select=*&order=nombre"),
      api.get("movimientos","?select=*,clientes(nombre,empresa)&order=created_at.desc&limit=500"),
      api.get("stock","?select=*,clientes(nombre,empresa)&order=fecha_entrada.desc"),
    ]);

    TARIFAS = (trs||[]).map(t=>({
      ...t,
      clientes_asignados: (cls||[]).filter(c=>c.tarifa_id===t.id).length,
    }));

    STOCK = (stk||[]).map(s=>({
      ...s,
      _empresa: s.clientes?.empresa||"—",
      _nombre: s.clientes?.nombre||"—",
    }));

    MOVIMIENTOS = (movs||[]).map(m=>({
      ...m,
      _empresa: m.clientes?.empresa||"—",
      _nombre: m.clientes?.nombre||"—",
      coste: parseFloat(m.coste||0),
      cantidad: parseFloat(m.cantidad||0),
    }));

    const hoy = hoyStr();
    const primer = primerDiaMes();
    const movHoy = MOVIMIENTOS.filter(m=>m.fecha===hoy);
    const movMes = MOVIMIENTOS.filter(m=>m.fecha>=primer);

    CLIENTES = (cls||[]).map(c=>({
      ...c,
      _tarifa: TARIFAS.find(t=>t.id===c.tarifa_id)?.nombre||"—",
      _pallets: STOCK.filter(s=>s.activo&&s.cliente_id===c.id).length,
      _facturado_mes: movMes.filter(m=>m.cliente_id===c.id).reduce((s,m)=>s+m.coste,0),
    }));

    KPI = {
      ops_hoy: movHoy.length,
      pallets_activos: STOCK.filter(s=>s.activo).length,
      ingresos_hoy: movHoy.reduce((s,m)=>s+m.coste,0),
      ocupacion: Math.min(Math.round((STOCK.filter(s=>s.activo).length/200)*100),100),
      ops_mes: movMes.length,
      ingresos_mes: movMes.reduce((s,m)=>s+m.coste,0),
    };

    SERIE_14D = Array.from({length:14},(_,i)=>{
      const d=new Date(); d.setDate(d.getDate()-(13-i));
      const k=d.toISOString().split("T")[0];
      const dm=MOVIMIENTOS.filter(m=>m.fecha===k);
      return {
        d: String(d.getDate()),
        alm: dm.filter(m=>m.tipo==="almacenaje").reduce((s,m)=>s+m.cantidad,0),
        pic: dm.filter(m=>["picking","empaquetado"].includes(m.tipo)).reduce((s,m)=>s+m.cantidad,0),
        car: dm.filter(m=>["carga","descarga"].includes(m.tipo)).reduce((s,m)=>s+m.cantidad,0),
      };
    });

    const cols={almacenaje:"#00C9CE",picking:"#5b8def",descarga:"#a78bfa",carga:"#f59e0b",empaquetado:"#ec4899","distribucion-interna":"#10b981","distribucion-externa":"#06b6d4",paletizacion:"#f97316",inventario:"#8b5cf6",devolucion:"#ef4444"};
    const cnts={};
    movMes.forEach(m=>cnts[m.tipo]=(cnts[m.tipo]||0)+1);
    const tot=movMes.length||1;
    DIST_TIPOS = Object.entries(cnts).sort((a,b)=>b[1]-a[1]).map(([tipo,cnt])=>({tipo,cnt,pct:Math.round(cnt/tot*100),color:cols[tipo]||"#00C9CE"}));

    const now = new Date();
    FACT_6M = Array.from({length:6},(_,i)=>{
      const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);
      const p=d.toISOString().split("T")[0].slice(0,7)+"-01";
      const u=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().split("T")[0];
      return {mes:MESES[d.getMonth()].slice(0,3),total:MOVIMIENTOS.filter(m=>m.fecha>=p&&m.fecha<=u).reduce((s,m)=>s+m.coste,0)};
    });

    if(_rerender) _rerender();
    return true;
  } catch(e) {
    console.error("cargarDatos error:", e);
    return false;
  }
};

// ── Toast hook ───────────────────────────────────────────────────
const useToast = () => {
  const [toasts, setToasts] = React.useState([]);
  const show = React.useCallback((msg, type="ok") => {
    const id = Date.now();
    setToasts(t=>[...t, {id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3500);
  },[]);
  const ToastEl = () => (
    <div className="toast-wrap">
      {toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}
    </div>
  );
  return {show, ToastEl};
};

// ── Sparkline SVG ─────────────────────────────────────────────────
const Sparkline = ({data=[], color="#00C9CE", h=40, w=100}) => {
  if(!data.length) return null;
  const max = Math.max(...data, 0.001);
  const pts = data.map((v,i)=>{
    const x = data.length < 2 ? w/2 : (i/(data.length-1))*w;
    const y = h - (v/max)*(h-4) - 2;
    return `${isNaN(x)?0:x},${isNaN(y)?h:y}`;
  }).join(" ");
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="kpi-sparkline">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" opacity=".8"/>
    </svg>
  );
};

// ── Donut Chart ───────────────────────────────────────────────────
const DonutChart = ({data=[], size=80, total=0}) => {
  if(!data.length) return <div style={{width:size,height:size,borderRadius:"50%",background:"var(--border)",display:"grid",placeItems:"center"}}><span style={{fontSize:10,color:"var(--fg3)"}}>Sin datos</span></div>;
  const r = (size-8)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  let offset=0;
  const slices = data.map(d=>{
    const pct = d.pct/100;
    const dash = pct*circ;
    const s = {offset, dash, color:d.color};
    offset += dash;
    return s;
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--border)" strokeWidth="8"/>
      {slices.map((s,i)=>(
        <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="8"
          strokeDasharray={`${s.dash} ${circ-s.dash}`} strokeDashoffset={-s.offset} strokeLinecap="butt"/>
      ))}
      <text x={cx} y={cy+4} textAnchor="middle" fill="var(--fg0)" fontSize="14" fontWeight="800" fontFamily="Raleway" style={{transform:`rotate(90deg)`,transformOrigin:`${cx}px ${cy}px`}}>{total}</text>
    </svg>
  );
};

// ── Bar Chart 14d ─────────────────────────────────────────────────
const BarChart14d = ({data=SERIE_14D}) => {
  const maxV = Math.max(...data.map(d=>d.alm+d.pic+d.car), 0.001);
  return (
    <div className="chart-bars">
      {data.map((d,i)=>{
        const total = d.alm+d.pic+d.car;
        const pAlm = total > 0 ? (d.alm/total)*100 : 0;
        const pPic = total > 0 ? (d.pic/total)*100 : 0;
        const pCar = total > 0 ? (d.car/total)*100 : 0;
        const h = Math.max((total/maxV)*100, total>0?4:0);
        return (
          <div key={i} className="col-day">
            <div className="col-stacks" style={{height:"100%"}}>
              <div style={{height:`${100-h}%`}}/>
              <div style={{height:`${h}%`,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
                {d.car>0&&<div className="bar-seg" style={{height:`${pCar}%`,background:"var(--amber)",minHeight:2}}/>}
                {d.pic>0&&<div className="bar-seg" style={{height:`${pPic}%`,background:"var(--blue)",minHeight:2}}/>}
                {d.alm>0&&<div className="bar-seg" style={{height:`${pAlm}%`,background:"var(--accent)",minHeight:2}}/>}
              </div>
            </div>
            <div className="axis-label">{d.d}</div>
          </div>
        );
      })}
    </div>
  );
};

// ── Operaciones ───────────────────────────────────────────────────
const Operaciones = ({onNew, show}) => {
  const [q, setQ] = React.useState("");
  const [fTipo, setFTipo] = React.useState("todos");
  const [fCli, setFCli] = React.useState("todos");
  const [sel, setSel] = React.useState(null);
  const [showForm, setShowForm] = React.useState(false);
  const [, rerender] = React.useReducer(x=>x+1,0);
  React.useEffect(()=>{ if(show) _rerender=rerender; },[show]);

  const rows = MOVIMIENTOS.filter(m=>{
    if(fTipo!=="todos"&&m.tipo!==fTipo) return false;
    if(fCli!=="todos"&&String(m.cliente_id)!==fCli) return false;
    if(q&&!(m._empresa+m.observaciones||"").toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const total = rows.reduce((s,m)=>s+m.coste,0);

  const exportar = () => csvDownload(rows.map(m=>({
    ID:m.id, Fecha:fmtFecha(m.fecha), Empresa:m._empresa,
    Tipo:TIPOS[m.tipo]?.l||m.tipo, Cantidad:m.cantidad, "Coste €":m.coste, Obs:m.observaciones||""
  })),["ID","Fecha","Empresa","Tipo","Cantidad","Coste €","Obs"],`ops_${hoyStr()}.csv`);

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1 className="page-title">Operaciones</h1>
          <p className="page-lead">{rows.length} registros · {fmt(total)}</p>
        </div>
        <div className="page-actions">
          <button className="btn btn-ghost btn-sm" onClick={exportar}><Icon n="download" s={13}/> CSV</button>
          <button className="btn btn-primary" onClick={()=>setShowForm(true)}><Icon n="plus" s={13}/> Nueva op.</button>
        </div>
      </div>

      {showForm && <NuevaOpForm onClose={()=>setShowForm(false)} onSaved={()=>{setShowForm(false);cargarDatos();}}/>}

      <div className="kpi-grid kpi-grid-4" style={{marginBottom:12}}>
        {[
          {l:"Total ops",v:rows.length,kc:"var(--accent)"},
          {l:"Coste total",v:fmt(total),kc:"var(--blue)"},
          {l:"Unidades",v:fmtN(rows.reduce((s,m)=>s+m.cantidad,0)),kc:"var(--amber)"},
          {l:"Clientes",v:new Set(rows.map(m=>m.cliente_id)).size,kc:"var(--green)"},
        ].map((k,i)=>(
          <div key={i} className="kpi" style={{"--kc":k.kc}}>
            <div className="kpi-label"><div className="kpi-dot"/>{k.l}</div>
            <div className="kpi-val" style={{fontSize:18}}>{k.v}</div>
          </div>
        ))}
      </div>

      <div className="tbl-wrap">
        <div className="tbl-toolbar">

          <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>
            <option value="todos">Todos los tipos</option>
            {Object.entries(TIPOS).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
          </select>
          <select value={fCli} onChange={e=>setFCli(e.target.value)}>
            <option value="todos">Todos los clientes</option>
            {CLIENTES.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}
          </select>
          <span className="count">{rows.length} ops</span>
        </div>
        {rows.length===0 ? <div className="empty-state"><div className="ico">📋</div><p>Sin resultados</p></div> : (
        <table className="tbl">
          <thead><tr><th>ID</th><th>Tipo</th><th>Cliente</th><th>Cant.</th><th>Coste</th><th>Fecha</th><th className="hide-mobile">Obs.</th><th></th></tr></thead>
          <tbody>
            {rows.map(m=>(
              <tr key={m.id} className={sel?.id===m.id?"selected":""} onClick={()=>setSel(sel?.id===m.id?null:m)}>

                <td><TipoChip tipo={m.tipo}/></td>
                <td style={{fontWeight:500}}>{m._empresa}</td>

                <td className="muted mono">{fmtFecha(m.fecha)}</td>
                <td className="muted hide-mobile" style={{maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.observaciones||""}</td>
                <td onClick={e=>e.stopPropagation()}>
                  <EliminarBtn tabla="movimientos" id={m.id} onDone={()=>{setSel(null);cargarDatos();}}/>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        )}
      </div>
    </div>
  );
};

const NuevaOpForm = ({onClose, onSaved, show:toast}) => {
  const [f, setF] = React.useState({
    cliente_id:"", tipo:"almacenaje", cantidad:"1",
    fecha:hoyStr(), observaciones:"", coste:0
  });

  React.useEffect(()=>{
    if(f.cliente_id && f.tipo && f.cantidad) {

  const guardar = async () => {

        fecha:f.fecha, observaciones:f.observaciones||null, coste:f.coste
      });
      onSaved();

    finally{setLoading(false);}
  };

  return (

            {CLIENTES.map(c=><option key={c.id} value={c.id}>{c.empresa||c.nombre}</option>)}

        <div className="field">
          <label>Tipo de operación *</label>

          </select>

        <div className="field">

        </div>
        <div className="field" style={{gridColumn:"span 2"}}>

          <span>Coste estimado según tarifa</span>
          <strong>{fmt(f.coste)}</strong>

      )}
      <div className="form-actions">
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>

      </div>

  );

// ── Eliminar btn ──────────────────────────────────────────────────
const EliminarBtn = ({tabla, id, onDone}) => {
  const [conf, setConf] = React.useState(false);
  if(conf) return (
    <div style={{display:"flex",gap:4}}>
      <button className="btn btn-danger btn-xs" onClick={async()=>{await api.del(tabla,id);setConf(false);onDone();}}>Sí</button>
      <button className="btn btn-ghost btn-xs" onClick={()=>setConf(false)}>No</button>
    </div>
  );
  return <button className="btn btn-ghost btn-icon btn-sm" onClick={()=>setConf(true)} title="Eliminar"><Icon n="trash" s={13}/></button>;
};

const SalidaForm = ({palletId, onClose, onSaved}) => {

};

const ClienteForm = ({cliente, onClose, onSaved}) => {

    if(!f.nombre){alert("El nombre es obligatorio");return;}
    setLoading(true);
    try {
      const data = {...f, tarifa_id:f.tarifa_id?parseInt(f.tarifa_id):null};

      else await api.post("clientes",data);
      onSaved();

    finally{setLoading(false);}

// ── Reportes ───────────────────────────────────────────────────────
const Reportes = ({show}) => {
  const hoy = new Date();
  const [mes, setMes] = React.useState(hoy.getMonth()+1);
  const [anio, setAnio] = React.useState(hoy.getFullYear());
  const [sendEmail, setSendEmail] = React.useState(false);
  const [emailTo, setEmailTo] = React.useState("");
  const [sending, setSending] = React.useState(false);
  const [, rerender] = React.useReducer(x=>x+1,0);
  React.useEffect(()=>{ if(show) _rerender=rerender; },[show]);

  const primer = `${anio}-${String(mes).padStart(2,"0")}-01`;
  const ultimo = ultimoDiaMes(mes,anio);
  const movsMes = MOVIMIENTOS.filter(m=>m.fecha>=primer&&m.fecha<=ultimo);
  const almacenaje = () => STOCK.filter(s=>{const e=s.fecha_entrada||"";const sa=s.fecha_salida||ultimo;return e<=ultimo&&sa>=primer;}).map(s=>{
    const c=CLIENTES.find(x=>x.id===s.cliente_id);
    const t=TARIFAS.find(x=>x.id===c?.tarifa_id);
    const pd=parseFloat(t?.precio_pallet_dia||0);
    const ei=new Date(Math.max(new Date(s.fecha_entrada),new Date(primer)));
    const si=new Date(Math.min(new Date(s.fecha_salida||ultimo),new Date(ultimo)));
    const dias=Math.max(Math.round((si-ei)/86400000)+1,0);
    return {empresa:c?.empresa||"—",pallet:s.pallet,ref:s.referencia||"—",entrada:s.fecha_entrada,salida:s.fecha_salida,dias,precio_dia:pd,coste:Math.round(dias*pd*100)/100};
  });
  const ops = (tipos) => movsMes.filter(m=>tipos.includes(m.tipo)).map(m=>({...m,empresa:m._empresa}));

  const secciones = [
    {t:"Almacenaje", ico:"📦", tipos:["almacenaje"], fn:almacenaje, kc:"var(--accent)"},
    {t:"Picking / Packing", ico:"🔍", tipos:["picking","empaquetado"], fn:()=>ops(["picking","empaquetado"]), kc:"var(--blue)"},
    {t:"Cargas / Descargas", ico:"🚛", tipos:["carga","descarga"], fn:()=>ops(["carga","descarga"]), kc:"var(--amber)"},
    {t:"Distribución", ico:"🚚", tipos:["distribucion-interna","distribucion-externa"], fn:()=>ops(["distribucion-interna","distribucion-externa"]), kc:"var(--green)"},
  ];

  const exportarSeccion = (sec) => {
    const d = sec.fn();
    const cols = ["Empresa","Pallet/ID","Cantidad/Días","Coste €"];
    const rows = d.map(r=>({Empresa:r.empresa||r._empresa||"",["Pallet/ID"]:r.pallet||r.id||"",["Cantidad/Días"]:r.dias||r.cantidad||0,["Coste €"]:r.coste||0}));
    csvDownload(rows,cols,`${sec.t.replace(/\//g,"-")}_${anio}_${mes}.csv`);
  };

  const generarPDFSeccion = (sec) => {
    const d = sec.fn();
    const total = d.reduce((s,r)=>s+(r.coste||0),0);
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${sec.t} - ${MESES[mes-1]} ${anio}</title><style>
    body{font-family:Arial,sans-serif;font-size:12px;color:#1a1a1a;padding:20px}
    h1{color:#000935;font-size:20px;margin-bottom:4px}
    .sub{color:#6b7280;font-size:11px;margin-bottom:20px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th{background:#000935;color:#fff;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase}
    td{padding:7px 10px;border-bottom:1px solid #f0f0f0;font-size:11px}
    tr:nth-child(even) td{background:#f9f9f9}
    .total{background:#000935;color:#fff;padding:14px 18px;border-radius:6px;border-left:4px solid #00C9CE;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
    .total-lbl{font-size:10px;color:#00C9CE;text-transform:uppercase;letter-spacing:.1em}
    .total-val{font-size:22px;font-weight:900}
    .header{background:#000935;color:#fff;padding:18px 24px;margin:-20px -20px 20px;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo span{color:#00C9CE}
    </style></head><body>
    <div class="header"><div class="logo">ONUS<span> EXPRESS</span></div><div style="font-size:11px;color:#94b4d4;text-align:right">${sec.t}<br>${MESES[mes-1]} ${anio}</div></div>
    <h1>${sec.t}</h1><div class="sub">${MESES[mes-1]} ${anio} · ${d.length} registros</div>
    <table><thead><tr><th>Empresa</th><th>Detalle</th><th>Unidades/Días</th><th>Coste</th></tr></thead>
    <tbody>${d.map(r=>`<tr><td><strong>${r.empresa||r._empresa||"—"}</strong></td><td>${r.pallet||TIPOS[r.tipo]?.l||r.tipo||"—"}</td><td>${r.dias||r.cantidad||0}</td><td style="text-align:right;font-weight:600">${new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(r.coste||0)}</td></tr>`).join("")}</tbody></table>
    <div class="total"><div><div class="total-lbl">Total ${sec.t}</div></div><div class="total-val">${new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(total)}</div></div>
    <div style="margin-top:24px;font-size:10px;color:#9ca3af;text-align:center;border-top:1px solid #e5e7eb;padding-top:10px">ONUS EXPRESS · Documento generado el ${new Date().toLocaleDateString("es-ES")}</div>
    </body></html>`;
    printPDF(html);
  };

  const enviarPorEmail = async () => {
    if(!emailTo){alert("Introduce un email");return;}
    setSending(true);
    try {
      const res = await auth.sendEmail({to:emailTo, mes, anio, tipo:"resumen", datos:secciones.map(s=>({nombre:s.t, datos:s.fn()}))});
      alert(res.ok?"Email enviado correctamente":"Error enviando email: "+(res.error||"desconocido"));
      setSendEmail(false);
    } catch(e){alert("Error: "+e.message);}
    finally{setSending(false);}
  };

  return (
    <div className="page">
      <div className="page-head">
        <div><h1 className="page-title">Reportes</h1><p className="page-lead">Análisis y exportación · {MESES[mes-1]} {anio}</p></div>
        <div className="page-actions">
          <select value={mes} onChange={e=>setMes(parseInt(e.target.value))} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"var(--r-sm)",padding:"6px 10px",color:"var(--fg1)",fontFamily:"var(--font)",fontSize:12}}>
            {MESES.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
          </select>
          <select value={anio} onChange={e=>setAnio(parseInt(e.target.value))} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"var(--r-sm)",padding:"6px 10px",color:"var(--fg1)",fontFamily:"var(--font)",fontSize:12}}>
            {[2024,2025,2026,2027].map(a=><option key={a}>{a}</option>)}
          </select>
          <button className="btn btn-ghost btn-sm" onClick={()=>setSendEmail(!sendEmail)}><Icon n="mail" s={13}/> Email</button>
        </div>
      </div>

      {sendEmail && (
        <div className="form-card">
          <div className="form-head"><span className="form-title">Enviar informe por email</span><button className="btn btn-ghost btn-icon btn-sm" onClick={()=>setSendEmail(false)}><Icon n="close" s={14}/></button></div>
          <div className="field"><label>Email destinatario</label><input type="email" value={emailTo} onChange={e=>setEmailTo(e.target.value)} placeholder="cliente@empresa.com"/></div>
          <div className="form-actions">
            <button className="btn btn-ghost btn-sm" onClick={()=>setSendEmail(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={enviarPorEmail} disabled={sending}>{sending?"Enviando…":"Enviar informe"}</button>
          </div>
        </div>
      )}

      <div className="grid-2">
        {secciones.map(sec=>{
          const d = sec.fn();
          const total = d.reduce((s,r)=>s+(r.coste||0),0);
          return (
            <div key={sec.t} className="card" style={{borderLeft:`3px solid ${sec.kc.replace("var(--accent)","#00C9CE").replace("var(--blue)","#5b8def").replace("var(--amber)","#f59e0b").replace("var(--green)","#10b981")}`}}>
              <div className="card-head">
                <div><div className="card-title">{sec.ico} {sec.t}</div><div className="card-sub">{d.length} registros</div></div>
              </div>
              <div style={{fontFamily:"var(--font-h)",fontSize:28,fontWeight:800,color:"var(--fg0)",marginBottom:14}}>{fmt(total)}</div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>generarPDFSeccion(sec)}><Icon n="pdf" s={13}/> PDF</button>
                <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>exportarSeccion(sec)}><Icon n="download" s={13}/> CSV</button>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card" style={{marginTop:14}}>
        <div className="card-head"><div className="card-title">Facturación · últimos 6 meses</div></div>
        <div style={{display:"flex",alignItems:"flex-end",gap:8,height:100}}>
          {FACT_6M.map((m,i)=>{
            const max = Math.max(...FACT_6M.map(x=>x.total),0.001);
            const h = Math.max((m.total/max)*100,m.total>0?4:0);
            return (
              <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <div style={{fontSize:9,color:"var(--fg3)",fontFamily:"var(--font-mono)"}}>{m.total>0?fmt(m.total).replace(",00",""):""}</div>
                <div style={{width:"100%",height:`${h}%`,background:"var(--accent)",borderRadius:"4px 4px 0 0",minHeight:m.total>0?4:0}}/>
                <div style={{fontSize:9,color:"var(--fg4)",fontFamily:"var(--font-mono)"}}>{m.mes}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

// ── Facturación ────────────────────────────────────────────────────
const Facturacion = ({show}) => {
  const hoy = new Date();
  const [mes, setMes] = React.useState(hoy.getMonth()+1);
  const [anio, setAnio] = React.useState(hoy.getFullYear());
  const [, rerender] = React.useReducer(x=>x+1,0);
  React.useEffect(()=>{ if(show) _rerender=rerender; },[show]);

  const primer = `${anio}-${String(mes).padStart(2,"0")}-01`;
  const ultimo = ultimoDiaMes(mes,anio);

  const resumen = React.useMemo(()=>CLIENTES.map(c=>{
    const movs = MOVIMIENTOS.filter(m=>m.cliente_id===c.id&&m.fecha>=primer&&m.fecha<=ultimo);
    const stks = STOCK.filter(s=>{const e=s.fecha_entrada||"";const sa=s.fecha_salida||ultimo;return s.cliente_id===c.id&&e<=ultimo&&sa>=primer;});
    const t=TARIFAS.find(x=>x.id===c.tarifa_id);
    const pd=parseFloat(t?.precio_pallet_dia||0);
    const alm = stks.reduce((s,s2)=>{
      const ei=new Date(Math.max(new Date(s2.fecha_entrada),new Date(primer)));
      const si=new Date(Math.min(new Date(s2.fecha_salida||ultimo),new Date(ultimo)));
      const dias=Math.max(Math.round((si-ei)/86400000)+1,0);
      return s+(dias*pd*s2.cantidad);
    },0);
    const pick = movs.filter(m=>["picking","empaquetado"].includes(m.tipo)).reduce((s,m)=>s+m.coste,0);
    const carg = movs.filter(m=>m.tipo==="carga").reduce((s,m)=>s+m.coste,0);
    const desc = movs.filter(m=>m.tipo==="descarga").reduce((s,m)=>s+m.coste,0);
    const dist = movs.filter(m=>m.tipo?.includes("distribucion")).reduce((s,m)=>s+m.coste,0);
    const total = alm+pick+carg+desc+dist;
    if(total===0&&movs.length===0) return null;
    return {c, tarifa:t?.nombre||"—", pallets:stks.length, alm:Math.round(alm*100)/100, pick:Math.round(pick*100)/100, carg:Math.round(carg*100)/100, desc:Math.round(desc*100)/100, dist:Math.round(dist*100)/100, total:Math.round(total*100)/100, movs};
  }).filter(Boolean).sort((a,b)=>b.total-a.total),[CLIENTES,MOVIMIENTOS,STOCK,TARIFAS,mes,anio]);

  const grandTotal = resumen.reduce((s,r)=>s+r.total,0);

  const exportar = () => csvDownload(resumen.map(r=>({Empresa:r.c.empresa||"",Tarifa:r.tarifa,Pallets:r.pallets,"Almacenaje €":r.alm,"Picking €":r.pick,"Cargas €":r.carg,"Descargas €":r.desc,"Distribución €":r.dist,"TOTAL €":r.total})),["Empresa","Tarifa","Pallets","Almacenaje €","Picking €","Cargas €","Descargas €","Distribución €","TOTAL €"],`facturacion_${anio}_${mes}.csv`);

  const pdfCliente = (r) => {

    body{font-family:Arial,sans-serif;font-size:12px;color:#1a1a1a;padding:20px}
    .header{background:#000935;color:#fff;padding:18px 24px;margin:-20px -20px 20px;display:flex;justify-content:space-between;align-items:center}

    .meta{display:flex;gap:24px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:10px 14px;margin:14px 0;font-size:11px}
    .meta-item{display:flex;flex-direction:column;gap:2px}
    .meta-label{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
    .meta-val{color:#111827;font-weight:600}
    table{width:100%;border-collapse:collapse;margin:10px 0}
    th{background:#000935;color:#fff;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase}
    td{padding:7px 10px;border-bottom:1px solid #f0f0f0}
    .total-box{background:#000935;color:#fff;padding:14px 18px;border-radius:6px;border-left:4px solid #00C9CE;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
    .total-lbl{font-size:10px;color:#00C9CE;text-transform:uppercase;letter-spacing:.1em}
    .total-val{font-size:22px;font-weight:900}
    </style></head><body>
    <div class="header"><div class="logo">ONUS<span> EXPRESS</span></div><div style="font-size:11px;color:#94b4d4;text-align:right">FACTURA<br>${MESES[mes-1]} ${anio}</div></div>
    <h1>${r.c.empresa||r.c.nombre}</h1>
    <p style="color:#6b7280;font-size:11px">${r.c.nombre} · ${r.c.condiciones_pago||"—"}</p>
    <div class="meta">
      <div class="meta-item"><div class="meta-label">Tarifa</div><div class="meta-val">${r.tarifa}</div></div>
      <div class="meta-item"><div class="meta-label">Pallets</div><div class="meta-val">${r.pallets}</div></div>
      <div class="meta-item"><div class="meta-label">Período</div><div class="meta-val">${MESES[mes-1]} ${anio}</div></div>
    </div>
    <table><thead><tr><th>Concepto</th><th style="text-align:right">Importe</th></tr></thead>
    <tbody>
      <tr><td>📦 Almacenaje</td><td style="text-align:right">${fmt(r.alm)}</td></tr>
      <tr><td>🔍 Picking / Empaquetado</td><td style="text-align:right">${fmt(r.pick)}</td></tr>
      <tr><td>🚛 Cargas</td><td style="text-align:right">${fmt(r.carg)}</td></tr>
      <tr><td>🏭 Descargas</td><td style="text-align:right">${fmt(r.desc)}</td></tr>
      <tr><td>🚚 Distribución</td><td style="text-align:right">${fmt(r.dist)}</td></tr>
    </tbody></table>
    <div class="total-box"><div><div class="total-lbl">Total a facturar · ${MESES[mes-1]} ${anio}</div></div><div class="total-val">${fmt(r.total)}</div></div>
    ${r.movs.length?`<h2 style="margin-top:20px;font-size:13px;color:#374151">Detalle de operaciones</h2>
    <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th style="text-align:right">Coste</th></tr></thead>
    <tbody>${r.movs.map(m=>`<tr><td>${fmtFecha(m.fecha)}</td><td>${TIPOS[m.tipo]?.l||m.tipo}</td><td>${m.cantidad}</td><td style="text-align:right">${fmt(m.coste)}</td></tr>`).join("")}</tbody></table>`:""}
    <div style="margin-top:24px;font-size:10px;color:#9ca3af;text-align:center;border-top:1px solid #e5e7eb;padding-top:10px">ONUS EXPRESS · ${new Date().toLocaleDateString("es-ES")}</div>
    </body></html>`;
    printPDF(html);
  };

  return (
    <div className="page">
      <div className="page-head">

                  <td className="muted mono">{fmtFecha(u.created_at)}</td>
                  <td className="muted mono">{u.last_sign_in_at?fmtFecha(u.last_sign_in_at):"Nunca"}</td>
                  <td><button className="btn btn-ghost btn-icon btn-sm" onClick={()=>{setEditando(u);setShowForm(true);}}><Icon n="edit" s={13}/></button></td>

const PerfilForm = ({usuario, onClose, onSaved}) => {
  const [f, setF] = React.useState({email:usuario?.email||"",nombre:usuario?._nombre||"",rol:usuario?._rol||"ops",password:""});
  const [loading, setLoading] = React.useState(false);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const guardar = async () => {
    setLoading(true);
    try {
      if(!usuario) {
        if(!f.email||!f.password){alert("Email y contraseña son obligatorios");setLoading(false);return;}
        const nu = await auth.createUser(f.email,f.password,_tok);
        if(nu.id) await api.post("perfiles",{id:nu.id,nombre:f.nombre||f.email.split("@")[0],rol:f.rol});
        else throw new Error(nu.message||"Error creando usuario");
      } else {
        try { await api.patch("perfiles",usuario.id,{nombre:f.nombre,rol:f.rol}); }
        catch { await api.post("perfiles",{id:usuario.id,nombre:f.nombre,rol:f.rol}); }
      }
      onSaved();
    } catch(e){alert("Error: "+e.message);}
    finally{setLoading(false);}
  };

  return (
    <div className="form-card">
      <div className="form-head"><span className="form-title">{usuario?"Editar usuario":"Invitar usuario"}</span><button className="btn btn-ghost btn-icon btn-sm" onClick={onClose}><Icon n="close" s={14}/></button></div>
      <div className="form-grid form-grid-2">
        {!usuario&&<div className="field"><label>Email *</label><input type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="usuario@empresa.com"/></div>}
        <div className="field"><label>Nombre completo</label><input value={f.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Juan García"/></div>
        <div className="field"><label>Rol</label><select value={f.rol} onChange={e=>set("rol",e.target.value)}>{Object.entries(ROLES_DEF).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}</select></div>
        {!usuario&&<div className="field"><label>Contraseña temporal *</label><input type="password" value={f.password} onChange={e=>set("password",e.target.value)} placeholder="Mínimo 8 caracteres"/></div>}
      </div>
      <div className="form-actions">
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={guardar} disabled={loading}>{loading?"Guardando…":usuario?"Actualizar":"Crear usuario"}</button>
      </div>
    </div>
  );
};

// ── Scanner (lector de código de barras) ──────────────────────────
const ScannerView = ({onClose, onScan}) => {
  const videoRef = React.useRef(null);
  const [status, setStatus] = React.useState("Iniciando cámara…");
  const [result, setResult] = React.useState(null);
  const [manualCode, setManualCode] = React.useState("");

  React.useEffect(()=>{
    let stream;
    const start = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        if(videoRef.current){videoRef.current.srcObject=stream;videoRef.current.play();}
        setStatus("Apunta a un código de barras o QR");
      } catch(e){setStatus("Sin acceso a cámara — usa el campo manual");}
    };
    start();
    return ()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); };
  },[]);

  const buscarPallet = async (code) => {
    const found = STOCK.find(s=>s.pallet===code||s.referencia===code);
    if(found){
      const c = CLIENTES.find(x=>x.id===found.cliente_id);
      setResult({...found,_empresa:c?.empresa||"—"});
    } else {
      setResult({notFound:true, code});
    }
  };

  return (
    <div className="scanner-overlay">
      <div style={{color:"var(--fg1)",fontSize:14,fontWeight:600,marginBottom:8}}>📷 Escáner de pallets</div>
      <div className="scanner-frame">
        <video ref={videoRef} playsInline muted style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        <div className="scanner-line"/>
      </div>
      <div style={{color:"var(--fg3)",fontSize:12}}>{status}</div>

      <div style={{display:"flex",gap:8,marginTop:8}}>
        <input value={manualCode} onChange={e=>setManualCode(e.target.value)} placeholder="Introduce código manualmente…"
          onKeyDown={e=>e.key==="Enter"&&buscarPallet(manualCode)}
          style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--r-sm)",padding:"8px 12px",color:"var(--fg1)",fontFamily:"var(--font)",fontSize:13,outline:"none",width:220}}/>
        <button className="btn btn-primary" onClick={()=>buscarPallet(manualCode)}>Buscar</button>
      </div>

      {result && (
        <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--r-md)",padding:16,minWidth:280,textAlign:"left"}}>
          {result.notFound ? (
            <div style={{color:"var(--red)"}}>❌ Pallet "{result.code}" no encontrado</div>
          ) : (
            <div>
              <div style={{fontWeight:700,fontSize:14,color:"var(--fg0)",marginBottom:8}}>✅ {result.pallet}</div>
              <div style={{fontSize:12,color:"var(--fg2)",display:"flex",flexDirection:"column",gap:4}}>
                <div>Empresa: <strong>{result._empresa}</strong></div>
                <div>Referencia: {result.referencia||"—"}</div>
                <div>Cantidad: {result.cantidad}</div>
                <div>Entrada: {fmtFecha(result.fecha_entrada)}</div>
                <div>Estado: {result.activo?"En almacén 🟢":"Salido 🔴"}</div>
              </div>
              {onScan&&<button className="btn btn-primary" style={{marginTop:10,width:"100%"}} onClick={()=>onScan(result)}>Usar este pallet</button>}
            </div>
          )}
        </div>
      )}

      <button className="btn btn-ghost" onClick={onClose}>Cerrar escáner</button>
    </div>
  );
};

        <div className="sb-logo">O</div>
        <div>
          <div className="sb-name">Onus WMS</div>
          <div className="sb-ver">v3.0 · Express</div>
        </div>
      </div>
      <nav className="sb-nav">
        {NAV.map((item,i)=>(
          <React.Fragment key={item.id}>
            {item.section&&<div className="sb-section">{item.section}</div>}
            <button className={`sb-item ${view===item.id?"active":""}`} onClick={()=>goTo(item.id)}>
              <Icon n={item.ico} s={15}/>
              {item.l}
              {item.badge&&item.badge()&&<span className="sb-badge">{item.badge()}</span>}
            </button>
          </React.Fragment>
        ))}
      </nav>
      <div className="sb-foot">
        <div className="sb-avatar">{(window._wmsUser?.email?.[0]||"U").toUpperCase()}</div>
        <div style={{flex:1,minWidth:0}}>
          <div className="sb-foot-name">{window._wmsUser?.email?.split("@")[0]||"Usuario"}</div>
          <div className="sb-foot-role">Onus WMS</div>
        </div>
        <button className="btn btn-ghost btn-icon btn-sm" title="Cerrar sesión" onClick={()=>window._wmsLogout&&window._wmsLogout()}><Icon n="logout" s={14}/></button>
      </div>
    </aside>
  );

  const MobileNav = () => {
    const items = NAV.filter(n=>["dash","ops","stock","reportes","perfiles"].includes(n.id));
    return (
      <div className="mobile-nav">
        {items.map(item=>(
          <button key={item.id} className={`mob-item ${view===item.id?"active":""}`} onClick={()=>goTo(item.id)}>
            <div className="mob-icon"><Icon n={item.ico} s={20}/></div>
            {item.l.slice(0,8)}
          </button>
        ))}
      </div>
    );
  };

  return (
    <div className="layout">
      <Sidebar/>
      <div className="main-area">
        <div className="topbar">
          <div className="crumb">
            <span>Onus WMS</span>
            <span className="crumb-sep">/</span>
            <span className="crumb-now">{CRUMBS[view]}</span>
          </div>
          <div className="topbar-r">
            <button className="topbar-btn" title="Escáner" onClick={()=>setShowScanner(true)}>📷</button>
            <button className="btn btn-primary btn-sm" onClick={()=>setShowNewOp(!showNewOp)}><Icon n="plus" s={13}/><span className="hide-mobile"> Nueva operación</span></button>
          </div>
        </div>

        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {showNewOp&&(
            <div style={{padding:"0 24px",paddingTop:16}}>
              <NuevaOpForm onClose={()=>setShowNewOp(false)} onSaved={()=>{setShowNewOp(false);cargarDatos();}}/>
            </div>
          )}
          {view==="dash"&&<Dashboard onNew={()=>setShowNewOp(true)} onPage={goTo}/>}
          {view==="ops"&&<Operaciones onNew={()=>setShowNewOp(true)} show={view==="ops"}/>}
          {view==="stock"&&<Stock show={view==="stock"}/>}
          {view==="clientes"&&<Clientes show={view==="clientes"}/>}
          {view==="tarifas"&&<Tarifas show={view==="tarifas"}/>}
          {view==="reportes"&&<Reportes show={view==="reportes"}/>}
          {view==="facturacion"&&<Facturacion show={view==="facturacion"}/>}
          {view==="perfiles"&&<Perfiles show={view==="perfiles"}/>}
        </div>
        <MobileNav/>
      </div>

      {showScanner&&<ScannerView onClose={()=>setShowScanner(false)} onScan={()=>setShowScanner(false)}/>}
    </div>
  );
};

// ── WMS Root ───────────────────────────────────────────────────────
const WMSRoot = () => {
  const [session, setSession] = React.useState(()=>loadSession());
  const [ready, setReady] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [, forceUpdate] = React.useReducer(x=>x+1,0);

  React.useEffect(()=>{
    if(!session?.access_token) return;
    _tok = session.access_token;
    window._wmsUser = session.user;
    window._wmsLogout = async () => {
      try{await auth.signOut(_tok);}catch(e){}
      clearSession(); setSession(null); setReady(false); _tok=null;
    };
    _rerender = forceUpdate;
    cargarDatos().then(ok=>{
      if(ok) setReady(true);
      else setError("No se pudieron cargar los datos. Verifica la conexión.");
    });
  },[session]);

  if(!session?.access_token) return <LoginScreen onLogin={s=>{saveSession(s);setSession(s);}}/>;

  if(!ready&&!error) return (
    <div className="spinner-wrap">
      <div className="spinner"/>
      <div style={{color:"var(--fg3)",fontSize:13}}>Cargando datos del almacén…</div>
    </div>
  );

  if(error) return (
    <div className="spinner-wrap">
      <div style={{fontSize:32}}>⚠️</div>
      <div style={{color:"var(--red)",fontSize:13,textAlign:"center",maxWidth:300}}>{error}</div>
      <button className="btn btn-primary" onClick={()=>{setError(null);cargarDatos().then(ok=>{if(ok)setReady(true);else setError("Error de conexión");})}}>Reintentar</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{clearSession();setSession(null);}}>Cerrar sesión</button>
    </div>
  );

  return <App/>;
};

ReactDOM.createRoot(document.getElementById("root")).render(<WMSRoot/>);

</script>
</body>
</html>
